<a class="big-card" [routerLink]="['/post', id()]">
  <span class="big-card-category">{{ category() }}</span>
  <h2 class="big-card-title">{{ title() }}</h2>
  <p class="big-card-description">{{ description() }}</p>
  <div class="big-card-footer">
    <span class="big-card-author">Por {{ author() }}</span>
    <span class="big-card-date">{{ date() }}</span>
  </div>
</a>
